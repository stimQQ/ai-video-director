<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="director-token" content="__TOKEN__">
<title>Video Director Console</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="mark" aria-hidden="true">▶</span>
    <div>
      <div class="title" id="title">Video Director</div>
      <div class="next" id="next"></div>
    </div>
  </div>
  <div class="meter" id="meter"></div>
  <div class="tools">
    <select id="project" class="hidden" aria-label="Project"></select>
    <button id="lang" class="ghost" type="button">中文</button>
  </div>
</header>
<nav class="steps" id="steps"></nav>
<main id="main"><p class="muted" id="loading">Loading…</p></main>
<div class="toast hidden" id="toast" role="status"></div>
<script src="/app.js"></script>
</body>
</html>
